# пока трейсы просто пишутся в лог, jaeger/tempo прикрутим на этапе 7.
# коллектор стоит посередине как раз чтобы менять бэкенд не трогая приложение

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # должен быть первым, иначе коллектор уйдёт в oom вместо того чтобы дропать
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  debug:
    verbosity: normal

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
