# локальный стенд, только инфра. сервисы пока запускаются с хоста через make run-api
# утилиты: docker compose -f deploy/docker-compose.yml --profile tools up -d

name: order-pulse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: op-postgres
    environment:
      POSTGRES_USER: orderpulse
      POSTGRES_PASSWORD: orderpulse
      POSTGRES_DB: orderpulse
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      # logical нужен чтобы рядом можно было поднять debezium и сравнить с outbox
      - -c
      - wal_level=logical
      - -c
      - max_connections=200
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderpulse -d orderpulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # kraft, без zookeeper. в 4.0 его вообще выпилили
  kafka:
    image: apache/kafka:3.9.0
    container_name: op-kafka
    environment:
      # фиксированный, иначе при пересоздании контейнера брокер не найдёт свои метаданные
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # два листенера: клиент после метаданных идёт на advertised, поэтому
      # для контейнеров и для хоста нужны разные адреса
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # иначе неявно созданный топик получит 1 партицию и дефолтный retention
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    logging: *default-logging

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: op-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1 \
            --config retention.ms="$$3" --config min.insync.replicas=1
        }
        create tracking.raw.v1   12 604800000
        create orders.events.v1  12 2592000000
        create orders.events.dlq  3 2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: "no"
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    container_name: op-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      # не lru: тут же лежат ключи идемпотентности, вытеснение = дубль события
      - --maxmemory-policy
      - "noeviction"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: op-clickhouse
    environment:
      CLICKHOUSE_DB: orderpulse
      CLICKHOUSE_USER: orderpulse
      CLICKHOUSE_PASSWORD: orderpulse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9001:9000"
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      # ch держит кучу файлов на партициях и честно упирается в дефолтный лимит
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "orderpulse", "--password", "orderpulse", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *default-logging

  neo4j:
    image: neo4j:5.26-community
    container_name: op-neo4j
    environment:
      NEO4J_AUTH: neo4j/orderpulse
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p orderpulse 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: op-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      # чтобы достучаться до сервиса на хосте, на линуксе без этого не работает
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.5.0
    container_name: op-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    container_name: op-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    logging: *default-logging

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: op-kafka-ui
    profiles: ["tools"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  chdata:
  neo4jdata:
  promdata:
  grafanadata:
