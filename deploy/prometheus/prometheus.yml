global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # /metrics появится на этапе 7, до этого цель будет DOWN и это норм
  - job_name: order-pulse
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: order-api
